<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Outlook PST/OST</title>
  <desc id="desc">An envelope in an archive tray with an orange magnifier on a rounded navy tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="0.5" stop-color="#000066"/>
      <stop offset="1" stop-color="#000033"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F6F2"/>
      <stop offset="1" stop-color="#AAB0FF"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#FF8C00" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF8C00" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile-clip">
      <rect x="64" y="64" width="896" height="896" rx="200"/>
    </clipPath>
  </defs>

  <!-- Tile: navy-500 to navy-900, lit from above, with a navy-400 rim. -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="380" fill="url(#sheen)" clip-path="url(#tile-clip)"/>
  <rect x="68" y="68" width="888" height="888" rx="196" fill="none" stroke="#7D86FF" stroke-opacity="0.35" stroke-width="8"/>

  <!-- Envelope standing in the tray. -->
  <path d="M316 232 H708 Q744 232 744 268 V520 H280 V268 Q280 232 316 232 Z" fill="#EEEEFF"/>
  <path d="M292 252 L512 412 L732 252" fill="none" stroke="#AAB0FF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Archive tray: the PST/OST file. -->
  <path d="M196 448 H316 V520 H708 V448 H828 V744 Q828 792 780 792 H244 Q196 792 196 744 Z" fill="url(#glyph)"/>
  <rect x="412" y="604" width="200" height="48" rx="24" fill="#000066" fill-opacity="0.75"/>
  <!-- Search: the one orange accent. -->
  <circle cx="724" cy="684" r="170" fill="url(#halo)"/>
  <circle cx="712" cy="672" r="92" fill="#000033" stroke="#FF8C00" stroke-width="44"/>
  <path d="M780 742 L852 814" fill="none" stroke="#FF8C00" stroke-width="56" stroke-linecap="round"/>
</svg>
