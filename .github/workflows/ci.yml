name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline regression suite
        run: python -B -W error::ResourceWarning -m unittest discover -s skills/outlook-pst/tests -v
      - name: CLI help
        run: python -B skills/outlook-pst/scripts/outlook_pst.py --help
      - name: Build self-contained plugin
        run: python -B skills/outlook-pst/scripts/build_plugin.py --out dist/plugin-0.2.0
